<!DOCTYPE html>
<html lang="tr">
<head>
    <charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Takip Etmeyenler Analiz Paneli</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #fe2c55;
            --accent-cyan: #25f4ee;
            --accent-purple: #7928ca;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Efekti */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(254, 44, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(37, 244, 238, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(121, 40, 202, 0.1) 0%, transparent 50%);
            filter: blur(60px);
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            z-index: 1;
        }

        /* Glassmorphism Kart */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header i {
            font-size: 40px;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Form Elemanları */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px 14px 45px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(37, 244, 238, 0.15);
        }

        .btn-analyze {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #d91b42);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(254, 44, 85, 0.4);
        }

        /* Yükleniyor Animasyonu */
        .loader-container {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-cyan);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Sonuç Alanı */
        .results-container {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-badge {
            background: rgba(254, 44, 85, 0.1);
            border: 1px solid rgba(254, 44, 85, 0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
            color: #ff859b;
        }

        .user-list {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 8px;
        }

        .user-list::-webkit-scrollbar {
            width: 6px;
        }

        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 13px;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--accent-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-profile {
            background: rgba(37, 244, 238, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(37, 244, 238, 0.2);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-profile:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .note {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="container">
        <div class="card">
            <div class="header">
                <i class="fa-brands fa-tiktok"></i>
                <h1>Takip Etmeyenler</h1>
                <p>Sizi takip etmeyen kişileri anında görüntüleyin</p>
            </div>

            <!-- Form -->
            <div id="formSection">
                <div class="input-group">
                    <label>TikTok Kullanıcı Adınız</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-at"></i>
                        <input type="text" id="usernameInput" placeholder="kullanici_adin">
                    </div>
                </div>

                <button class="btn-analyze" onclick="startAnalysis()">
                    <i class="fa-solid fa-magnifying-glass"></i> Analiz Et
                </button>
            </div>

            <!-- Yükleniyor -->
            <div class="loader-container" id="loaderSection">
                <div class="spinner"></div>
                <p style="font-size: 13px; color: var(--text-muted);" id="statusText">Sunucuya bağlanılıyor...</p>
            </div>

            <!-- Sonuçlar -->
            <div class="results-container" id="resultsSection">
                <div class="stats-badge" id="statsText">
                    Sizi takip etmeyen <span id="countNum">0</span> kişi bulundu.
                </div>

                <div class="user-list" id="userList">
                    <!-- Kullanıcılar dinamik olarak buraya gelecek -->
                </div>

                <button class="btn-analyze" style="margin-top: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); box-shadow: none;" onclick="resetApp()">
                    <i class="fa-solid fa-rotate-right"></i> Yeni Analiz Yap
                </button>
            </div>

            <div class="note">
                <i class="fa-solid fa-shield-halved"></i> Güvenli Arayüz • Tarayıcı Tabanlı Kontrol
            </div>
        </div>
    </div>

    <script>
        function startAnalysis() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if(!username) {
                alert('Lütfen geçerli bir TikTok kullanıcı adı girin!');
                return;
            }

            // Arayüz geçişleri
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('loaderSection').style.display = 'block';

            // Simüle edilmiş gerçekçi tarama adımları (TikTok güvenlik duvarı ve veri eşitleme simülasyonu)
            const statuses = [
                "Hesap verileri taranıyor...",
                "Takip edilenler listesi çekiliyor...",
                "Takipçi listesi karşılaştırılıyor...",
                "Karşılıklı takipler filtreleniyor..."
            ];

            let step = 0;
            const statusInterval = setInterval(() => {
                step++;
                if(step < statuses.length) {
                    document.getElementById('statusText').innerText = statuses[step];
                }
            }, 700);

            // Analiz bittikten sonra sonuç ekranı
            setTimeout(() => {
                clearInterval(statusInterval);
                document.getElementById('loaderSection').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
                
                generateMockResults(username);
            }, 3000);
        }

        function generateMockResults(username) {
            // Örnek veri simülasyonu (Tarayıcı güvenliği nedeniyle harici API kısıtlamalarını aşmak için dinamik yapı)
            const mockUnfollowers = [
                { name: "berkay_ozdemir", initial: "B" },
                { name: "zeynep.fx", initial: "Z" },
                { name: "kaan_reis_34", initial: "K" },
                { name: "irem_unal", initial: "İ" },
                { name: "mert.editler", initial: "M" },
                { name: "cemre.c", initial: "C" }
            ];

            document.getElementById('countNum').innerText = mockUnfollowers.length;
            
            const listContainer = document.getElementById('userList');
            listContainer.innerHTML = '';

            mockUnfollowers.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.innerHTML = `
                    <div class="user-info">
                        <div class="user-avatar">${user.initial}</div>
                        <span>@${user.name}</span>
                    </div>
                    <a href="https://www.tiktok.com/@${user.name}" target="_blank" class="btn-profile">Profili Gör</a>
                `;
                listContainer.appendChild(item);
            });
        }

        function resetApp() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('usernameInput').value = '';
        }
    </script>
</body>
</html>
